<style>
:root {
  --bg: #ffffff;
  --bg-card: #f8fafc;
  --bg-hover: #f1f5f9;
  --bg-code: #f1f5f9;
  --bg-accent: #ede9fe;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --text-code: #334155;
  --red: #dc2626;
  --blue: #2563eb;
  --purple: #7c3aed;
  --teal: #0f766e;
  --orange: #ea580c;
  --pink: #be185d;
  --indigo: #4338ca;
  --sky: #0369a1;
  --green: #65a30d;
  --violet: #9333ea;
  --amber: #b45309;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Mono', 'SF Mono', monospace;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
}
.container { max-width: 820px; margin: 0 auto; padding: 20px 16px; }

/* ─── Top Navigation ─── */
.top-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}
.top-nav .container { padding: 0 16px; }
.nav-title {
  font-family: 'Outfit', sans-serif;
  font-weight: 900; font-size: 18px;
  color: var(--text-primary);
  text-align: center; margin-bottom: 10px;
}
.nav-tabs {
  display: flex; gap: 4px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
  padding-bottom: 2px;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 6px 14px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  cursor: pointer; white-space: nowrap;
  font-family: inherit;
  transition: all 0.15s;
}
.nav-tab:hover { background: var(--bg-card); }
.nav-tab.active {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
}

/* ─── Page Sections ─── */
.page { display: none; }
.page.active { display: block; }
.page-header { text-align: center; margin-bottom: 20px; padding-top: 16px; }
.page-label {
  font-size: 10px; letter-spacing: 5px;
  color: var(--text-muted); text-transform: uppercase;
  margin-bottom: 4px;
}
.page-title {
  font-family: 'Outfit', sans-serif;
  font-size: 24px; font-weight: 900;
  color: var(--text-primary);
}
.page-subtitle {
  font-size: 11.5px; color: var(--text-secondary);
  margin-top: 6px; line-height: 1.5;
}

/* ─── Filter Pills ─── */
.filter-row {
  display: flex; flex-wrap: wrap; gap: 5px;
  justify-content: center; margin-bottom: 16px;
}
.filter-pill {
  padding: 4px 10px; font-size: 10px; font-weight: 600;
  border-radius: 16px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-muted);
  cursor: pointer; font-family: inherit;
  transition: all 0.12s;
}
.filter-pill.active {
  border-color: var(--purple);
  background: rgba(124,58,237,0.08);
  color: var(--purple);
}

/* ─── Cards ─── */
.card {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.card:hover { border-color: #cbd5e1; }
.card.expanded { background: var(--bg-hover); }
.card-header {
  display: flex; align-items: center; gap: 10px;
}
.card-icon { font-size: 22px; flex-shrink: 0; }
.card-title {
  font-family: 'Outfit', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--text-primary);
}
.card-meta { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.card-summary {
  font-size: 11.5px; color: var(--text-secondary);
  margin-top: 8px; padding-left: 32px; line-height: 1.6;
}
.card-arrow {
  font-size: 16px; color: var(--text-muted);
  transition: transform 0.2s; margin-left: auto;
}
.card.expanded .card-arrow { transform: rotate(180deg); }

/* ─── Expandable Content ─── */
.card-details { display: none; margin-top: 14px; padding-left: 32px; }
.card.expanded .card-details { display: flex; flex-direction: column; gap: 10px; }

/* ─── Signal Items ─── */
.signal-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
}
.signal-name {
  font-family: 'Outfit', sans-serif;
  font-size: 12px; font-weight: 700;
}
.signal-formula {
  font-size: 10.5px; color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  background: var(--bg-code);
  padding: 3px 7px; border-radius: 4px;
  margin: 4px 0 6px;
}
.signal-note { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }

/* ─── Badges ─── */
.badge {
  font-size: 8px; font-weight: 700; letter-spacing: 0.8px;
  padding: 2px 7px; border-radius: 3px;
  color: white; white-space: nowrap; display: inline-block;
  text-transform: uppercase;
}
.badge-high { background: var(--red); }
.badge-medium { background: #f59e0b; color: #000; }
.badge-low { background: #6b7280; }

/* ─── Code Blocks ─── */
.code-block {
  font-size: 11px; color: var(--text-code); line-height: 1.7;
  font-family: 'DM Mono', monospace;
  background: var(--bg-code);
  padding: 14px 16px; border-radius: 6px;
  border: 1px solid var(--border);
  white-space: pre-wrap; overflow-x: auto;
  margin-top: 10px;
}

/* ─── Info Box ─── */
.info-box {
  padding: 14px 18px; border-radius: 8px;
  margin-bottom: 14px;
}
.info-box.purple {
  background: linear-gradient(135deg, #ede9fe 0%, #e0e7ff 100%);
  border: 1px solid #c7d2fe;
}
.info-box-title {
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 700;
  margin-bottom: 8px;
}
.info-box-text {
  font-size: 11px; color: var(--text-secondary); line-height: 1.8;
}
.info-box-text strong { color: var(--text-primary); }

/* ─── Rank Number ─── */
.rank-num {
  width: 32px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900;
  font-family: 'Outfit', sans-serif;
  flex-shrink: 0;
}

/* ─── Detail Rows ─── */
.detail-row {
  padding: 10px 12px; border-radius: 6px;
  background: var(--bg-code); border: 1px solid var(--border);
}
.detail-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.5px; margin-bottom: 4px;
}
.detail-text { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }

/* ─── Search ─── */
.search-box {
  width: 100%; padding: 10px 14px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 12px; font-family: inherit;
  outline: none; margin-bottom: 16px;
}
.search-box:focus { border-color: var(--purple); }
.search-count { font-size: 10px; color: var(--text-muted); text-align: center; margin: -10px 0 12px; }

/* ─── Category Stats ─── */
.stats-row {
  display: flex; gap: 4px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 16px;
}
.stat-chip {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px;
  text-align: center; cursor: pointer;
  transition: all 0.12s;
}
.stat-chip:hover { border-color: #cbd5e1; }
.stat-chip-label { font-size: 9px; letter-spacing: 0.5px; }
.stat-chip-num { font-size: 14px; font-weight: 800; color: var(--text-primary); }

/* ─── Sub Navigation (for multi-module pages) ─── */
.sub-nav {
  display: flex; gap: 4px; margin-bottom: 16px;
  justify-content: center; flex-wrap: wrap;
}
.sub-nav-btn {
  padding: 8px 12px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--bg-card); font-family: inherit;
  text-align: center; min-width: 80px;
  transition: all 0.12s;
}
.sub-nav-btn .icon { font-size: 16px; }
.sub-nav-btn .label {
  font-size: 8px; font-weight: 700;
  color: var(--text-muted); line-height: 1.2;
  margin-top: 2px;
}
.sub-nav-btn.active { border-color: var(--purple); background: rgba(124,58,237,0.06); }
.sub-nav-btn.active .label { color: var(--purple); }

/* ─── Nifty-specific note ─── */
.nifty-note {
  margin: 12px 0 0 32px;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 10px;
}
.nifty-note-label { font-weight: 700; margin-bottom: 4px; }
.nifty-note-text { font-size: 11px; color: var(--text-secondary); line-height: 1.6; }

/* ─── Signal list (encyclopedia) ─── */
.signal-list-item {
  font-size: 11px; color: var(--text-secondary);
  padding: 4px 8px; border-radius: 4px;
  line-height: 1.5;
  border-left: 2px solid transparent;
}
.signal-list-item:nth-child(even) { background: var(--bg-code); }
.signal-list-item .num {
  color: var(--text-muted); font-size: 9px; margin-right: 6px;
}
.signal-list-item.highlight {
  border-left-color: var(--purple);
  background: rgba(124,58,237,0.06);
  color: var(--purple); font-weight: 700;
}

/* ─── Phase header ─── */
.phase-selector { display: flex; gap: 6px; margin-bottom: 16px; justify-content: center; }
.phase-btn {
  padding: 10px 16px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--bg-card); font-family: inherit;
  flex: 1; text-align: center;
  transition: all 0.12s;
}
.phase-btn .week { font-size: 12px; font-weight: 800; }
.phase-btn .range { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
.phase-btn.active { border-color: var(--purple); background: rgba(124,58,237,0.06); }
.phase-btn.active .week { color: var(--purple); }

/* ─── Responsive ─── */
@media (max-width: 640px) {
  .nav-title { font-size: 15px; }
  .page-title { font-size: 20px; }
  .card { padding: 12px 14px; }
  .card-details { padding-left: 10px; }
}
</style>

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
  });
});

function esc(s) { 
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); 
}

function badge(level) {
  const map = { high: ['CORE','badge-high'], medium: ['IMPORTANT','badge-medium'], low: ['SUPPLEMENTARY','badge-low'] };
  const [label, cls] = map[level] || ['',''];
  return `<span class="badge ${cls}">${label}</span>`;
}

function tagBadge(text, color) {
  return `<span class="badge" style="background:${color}">${esc(text)}</span>`;
}

function renderEncyclopedia() {
  const el = document.getElementById('page-encyclopedia');
  const total = encyclopediaData.reduce((a,c) => a + c.signals.length, 0);

  let h = `
    <div class="page-header">
      <div class="page-label">Nifty 50 — Complete Encyclopedia</div>
      <div class="page-title" style="background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${total} Alpha Signals</div>
      <p class="page-subtitle">${encyclopediaData.length} categories — from basic momentum to satellite imagery</p>
    </div>
    <input class="search-box" type="text" placeholder="Search signals... (e.g., 'FII', 'VIX', 'VWAP', 'monsoon')" id="enc-search">
    <div class="search-count" id="enc-count" style="display:none"></div>
    <div class="stats-row" id="enc-stats"></div>
    <div id="enc-cards"></div>
    <div class="info-box purple" style="margin-top:20px;text-align:center">
      <div style="font-family:'Outfit',sans-serif;font-size:28px;font-weight:900;color:var(--purple)">${total}</div>
      <div class="info-box-text">Total signals. Each can be computed on multiple timeframes, creating 3-5× more features.<br><strong>Start with 20-30 core signals. Add complexity only when base model is profitable.</strong></div>
    </div>
  `;
  el.innerHTML = h;

  let expandedCat = null;

  function render(query) {
    const q = (query || '').toLowerCase();
    const filtered = q ? encyclopediaData.map(c => ({
      ...c, signals: c.signals.filter(s => s.toLowerCase().includes(q))
    })).filter(c => c.signals.length > 0) : encyclopediaData;

    const filteredTotal = filtered.reduce((a,c) => a + c.signals.length, 0);
    const countEl = document.getElementById('enc-count');
    if (q) { countEl.style.display = 'block'; countEl.textContent = `${filteredTotal} signals match "${q}"`; }
    else { countEl.style.display = 'none'; }

    // Stats
    let stats = '';
    encyclopediaData.forEach(c => {
      const match = filtered.find(f => f.id === c.id);
      const count = match ? match.signals.length : 0;
      const dim = q && count === 0;
      stats += `<div class="stat-chip" style="opacity:${dim?0.3:1}" onclick="toggleEncCat('${c.id}')">
        <div class="stat-chip-label" style="color:${c.color}">${c.icon} ${c.name.split('&')[0].split('/')[0].trim()}</div>
        <div class="stat-chip-num">${q ? count : c.signals.length}</div>
      </div>`;
    });
    document.getElementById('enc-stats').innerHTML = stats;

    // Cards
    let cards = '';
    filtered.forEach(cat => {
      const isOpen = expandedCat === cat.id;
      cards += `<div class="card ${isOpen?'expanded':''}" onclick="toggleEncCat('${cat.id}')">
        <div class="card-header">
          <span class="card-icon">${cat.icon}</span>
          <div style="flex:1">
            <span class="card-title" style="color:${isOpen?cat.color:'var(--text-primary)'}">${esc(cat.name)}</span>
            <span style="font-size:10px;color:var(--text-muted);margin-left:8px">${cat.signals.length} signals</span>
          </div>
          <span class="card-arrow">▾</span>
        </div>
        ${isOpen ? `<div class="card-details" style="display:flex">
          ${cat.signals.map((sig,j) => {
            const hl = q && sig.toLowerCase().includes(q);
            return `<div class="signal-list-item ${hl?'highlight':''}">
              <span class="num">${String(j+1).padStart(2,'0')}</span>${esc(sig)}
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>`;
    });
    document.getElementById('enc-cards').innerHTML = cards;
  }

  window.toggleEncCat = function(id) {
    expandedCat = expandedCat === id ? null : id;
    render(document.getElementById('enc-search').value);
  };

  document.getElementById('enc-search').addEventListener('input', (e) => {
    expandedCat = null;
    render(e.target.value);
  });

  render('');
}

          <button class="phase-btn ${activePhase===p.id?'active':''}" onclick="setPhase('${p.id}')">
            <div class="week" style="${activePhase===p.id?'color:'+p.color:''}">${p.week}</div>
            <div class="range">#${p.signals[0].rank}-${p.signals[p.signals.length-1].rank}</div>
          </button>
        `).join('')}
      </div>
      <div class="info-box" style="background:${phase.color}08;border:1px solid ${phase.color}33">
        <div class="info-box-title" style="color:${phase.color}">${esc(phase.name)}</div>
        <div class="info-box-text">${esc(phase.description)}</div>
      </div>
    `;

    phase.signals.forEach(sig => {
      const isOpen = expandedSig === sig.rank;
      h += `<div class="card ${isOpen?'expanded':''}" onclick="toggleSig(${sig.rank})">
        <div class="card-header">
          <div class="rank-num" style="background:${phase.color}15;color:${phase.color}">#${sig.rank}</div>
          <div style="flex:1">
            <div class="card-title">${esc(sig.name)}</div>
            <div class="card-meta">${sig.catIcon} ${esc(sig.category)}</div>
          </div>
          <span class="card-arrow">▾</span>
        </div>
        <div class="card-summary">${esc(sig.why)}</div>
        ${isOpen ? `<div class="card-details" style="display:flex">
          ${[
            {label:'📐 Formula', text: sig.formula, color:'#7c3aed'},
            {label:'📡 Data Source', text: sig.dataSource, color:'#0369a1'},
            {label:'⚙️ Implementation', text: sig.implementation, color:'#b45309'},
            {label:'📈 Edge / Historical', text: sig.edge, color:'#0f766e'},
            {label:'⏱️ Timeframe', text: sig.timeframe, color:'#dc2626'},
          ].map(d => `
            <div class="detail-row">
              <div class="detail-label" style="color:${d.color}">${d.label}</div>
              <div class="detail-text">${esc(d.text)}</div>
            </div>
          `).join('')}
        </div>` : ''}
      </div>`;
    });

    // Implementation checklist
    h += `<div class="info-box purple" style="margin-top:20px">
      <div class="info-box-title" style="color:var(--purple)">✅ Implementation Checklist</div>
      <div class="info-box-text">
        <strong style="color:var(--red)">Week 1:</strong> Set up NSE data pipelines. Automate daily downloads.<br>
        <strong style="color:var(--red)">Week 2:</strong> Implement signals #1-10. Build dashboard. Paper trade.<br>
        <strong style="color:var(--red)">Week 3:</strong> Implement signals #11-20. Start combining into composite score.<br>
        <strong style="color:var(--red)">Week 4:</strong> Backtest composite score vs Nifty returns. Iterate weights.<br>
        <strong style="color:var(--red)">Week 5:</strong> Implement signals #21-30. Add LLM sentiment. Connect macro feeds.<br>
        <strong style="color:var(--red)">Week 6:</strong> Full system backtest. Compare phases. Measure marginal improvement.<br>
        <strong style="color:var(--red)">Week 7-8:</strong> Paper trade live with all 30. Track accuracy. Kill bad signals.<br>
        <strong style="color:var(--red)">Week 9+:</strong> Go live with small capital. Scale gradually.
      </div>
    </div>`;

    el.innerHTML = h;
  }

  window.setPhase = function(id) { activePhase = id; expandedSig = null; render(); };
  window.toggleSig = function(rank) { expandedSig = expandedSig === rank ? null : rank; render(); };
  render();
}
